
services:
  # Servicio de MySQL
  db:
    image: mysql:8.0
    container_name: proyecto-arduino-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio de la aplicación Flask
  web:
    build: .
    container_name: proyecto-arduino-web
    restart: always
    env_file:
      - .env
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./static:/app/static
      - ./templates:/app/templates
      - ./Model:/app/Model

volumes:
  mysql_data:

