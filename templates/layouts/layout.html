<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{% block title %}LED Control{% endblock %}</title>
    <meta name="description" content="Control de LEDs vía web con Arduino">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    
    <!-- CSS Framework -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Base CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dasboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
    
    <!-- Page specific CSS -->
    {% block extra_css %}{% endblock %}
    
    <!-- Base JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/mobile-helpers.js') }}"></script>
    
    <!-- Page specific JS -->
    {% block extra_js %}{% endblock %}
</head>
<body>
    <!-- Navegación móvil -->
    {% include 'components/mobile-nav.html' %}
    
    <!-- Container de efectos visuales -->
    <div id="glow-container"></div>
    
    <div class="d-flex main-layout">
        <!-- Sidebar -->
        {% include 'components/sidebar.html' %}
        
        <!-- Contenido principal -->
        <main class="flex-grow-1 p-4">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Scripts base -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/effects.js') }}"></script>
    
    <!-- Scripts específicos de la página -->
    {% block page_scripts %}{% endblock %}
</body>
</html>
