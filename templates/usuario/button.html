<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control LED - {{ session.usuario }}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/led-combined.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>  
    <div id="glow-container"></div>
    
    <!-- Header personalizado con nombre del usuario (estilo del segundo archivo) -->
    <div class="user-header-custom">
        <div class="user-info">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
                <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
            </svg>
            <span class="username">{{ session.usuario }}</span>
        </div>
    </div>
    
    <!-- Botones de navegación (estilo del primer archivo) -->
    <div class="navigation-buttons">
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-light btn-sm nav-btn" title="Dashboard">
            <i class="bi bi-arrow-left-circle-fill me-1"></i>
            Dashboard
        </a>
        <a href="{{ url_for('see_blockchain') }}" class="btn btn-outline-light btn-sm nav-btn" title="Historial">
            <i class="bi bi-list-ul me-1"></i>
            Historial
        </a>
    </div>

    <!-- Contenedor de LEDs (estilo del segundo archivo con mejoras) -->
    <div class="led-control-container">
        <!-- LED 1 -->
        <div class="led-switch" data-led="1">
            <span class="led-text">LED 1</span>
            <input type="checkbox" class="estado_led" data-led="1" id="led1">
            <label for="led1" class="led-label"></label>
        </div>

        <!-- LED 2 -->
        <div class="led-switch" data-led="2">
            <span class="led-text">LED 2</span>
            <input type="checkbox" class="estado_led" data-led="2" id="led2">
            <label for="led2" class="led-label"></label>
        </div>

        <!-- LED 3 -->
        <div class="led-switch" data-led="3">
            <span class="led-text">LED 3</span>
            <input type="checkbox" class="estado_led" data-led="3" id="led3">
            <label for="led3" class="led-label"></label>
        </div>

        <!-- LED 4 -->
        <div class="led-switch" data-led="4">
            <span class="led-text">LED 4</span>
            <input type="checkbox" class="estado_led" data-led="4" id="led4">
            <label for="led4" class="led-label"></label>
        </div>

        <!-- LED 5 -->
        <div class="led-switch" data-led="5">
            <span class="led-text">LED 5</span>
            <input type="checkbox" class="estado_led" data-led="5" id="led5">
            <label for="led5" class="led-label"></label>
        </div>

        <!-- LED 6 -->
        <div class="led-switch" data-led="6">
            <span class="led-text">LED 6</span>
            <input type="checkbox" class="estado_led" data-led="6" id="led6">
            <label for="led6" class="led-label"></label>
        </div>

        <!-- LED 7 -->
        <div class="led-switch" data-led="7">
            <span class="led-text">LED 7</span>
            <input type="checkbox" class="estado_led" data-led="7" id="led7">
            <label for="led7" class="led-label"></label>
        </div>

        <!-- LED 8 -->
        <div class="led-switch" data-led="8">
            <span class="led-text">LED 8</span>
            <input type="checkbox" class="estado_led" data-led="8" id="led8">
            <label for="led8" class="led-label"></label>
        </div>
        
        <!-- TODOS -->
        <div class="led-switch" data-led="ALL">
            <span class="led-text">TODOS</span>
            <input type="checkbox" class="estado_led" data-led="ALL" id="ledAll">
            <label for="ledAll" class="led-label"></label>
        </div>
    </div>


    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/effects.js') }}"></script>

    <script>
        const urlEstadoLed = "{{ url_for('estado_led') }}";
        const urlGuardarEstado = "{{ url_for('save_estado') }}";
    </script>
    <script src="{{ url_for('static', filename='js/button.js') }}"></script>

</body>
</html>
