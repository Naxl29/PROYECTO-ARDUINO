<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control LED - {{ session.usuario }}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/led-combined.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>  
    <div id="glow-container"></div>
    
    <!-- Header personalizado con nombre del usuario (estilo del segundo archivo) -->
    <div class="user-header-custom">
        <div class="user-info">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
                <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
            </svg>
            <span class="username">{{ session.usuario }} ({{ user_role }})</span>
        </div>
    </div>
    
    <!-- Botones de navegación (estilo del primer archivo) -->
    <div class="navigation-buttons">
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-light btn-sm nav-btn" title="Dashboard">
            <i class="bi bi-arrow-left-circle-fill me-1"></i>
            Dashboard
        </a>
        <a href="{{ url_for('see_blockchain') }}" class="btn btn-outline-light btn-sm nav-btn" title="Historial">
            <i class="bi bi-list-ul me-1"></i>
            Historial
        </a>
    </div>

    <!-- Contenedor de LEDs (estilo del segundo archivo con mejoras) -->
    <div class="led-control-container">
        {% for led_id in role_config.permissions.accessible_leds %}
            {% if led_id != 'ALL' %}
        <!-- LED {{ led_id }} - {{ led_names[led_id] }} -->
        <div class="led-switch" data-led="{{ led_id }}">
            <span class="led-text">{{ led_names[led_id] }}</span>
            <input type="checkbox" class="estado_led" data-led="{{ led_id }}" id="led{{ led_id }}">
            <label for="led{{ led_id }}" class="led-label"></label>
        </div>
            {% endif %}
        {% endfor %}
        
        {% if 'ALL' in role_config.permissions.accessible_leds %}
        <!-- Botón especial ENCENDER TODOS (solo ADMIN) -->
        <div class="led-switch" data-led="ALL">
            <span class="led-text">{{ led_names['ALL'] }}</span>
            <input type="checkbox" class="estado_led" data-led="ALL" id="ledAll">
            <label for="ledAll" class="led-label"></label>
        </div>
        {% endif %}
    </div>


    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/effects.js') }}"></script>

    <script>
        const urlEstadoLed = "{{ url_for('estado_led') }}";
        const urlGuardarEstado = "{{ url_for('save_estado') }}";
    </script>
    <script src="{{ url_for('static', filename='js/button.js') }}"></script>

</body>
</html>
