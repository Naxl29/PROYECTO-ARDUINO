<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botón</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>  
    <div id="glow-container"></div>
    
    <div class="mb-3">
        <a href="{{ url_for('dashboard') }}" class="boton-back" title="Salir">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-door-open-fill" viewBox="0 0 16 16">
                <path d="M1.5 15a.5.5 0 0 0 0 1h13a.5.5 0 0 0 0-1H13V2.5A1.5 1.5 0 0 0 11.5 1H11V.5a.5.5 0 0 0-.57-.495l-7 1A.5.5 0 0 0 3 1.5V15zM11 2h.5a.5.5 0 0 1 .5.5V15h-1zm-2.5 8c-.276 0-.5-.448-.5-1s.224-1 .5-1 .5.448.5 1-.224 1-.5 1"/>
            </svg>     
        </a>
    </div>
    
    <div class="bg-gradient">
        <div class="botones">
            <a href="{{ url_for('see_blockchain') }}" class="boton_2" title="Historial">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="bi bi-person-lines-fill" viewBox="0 0 16 16">
                    <path d="M6 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m-5 6s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zM11 3.5a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 0 1h-4a.5.5 0 0 1-.5-.5m.5 2.5a.5.5 0 0 0 0 1h4a.5.5 0 0 0 0-1zm2 3a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1zm0 3a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1z"/>
                </svg>
            </a>
        </div>
    </div>

    <div class="led-control-container">
        <!-- LED 1 -->
        <div class="led-switch" data-led="1">
            <span class="led-text">LED 1</span>
            <input type="checkbox" class="estado_led" data-led="1" id="led1">
            <label for="led1" class="led-label"></label>
        </div>

        <!-- LED 2 -->
        <div class="led-switch" data-led="2">
            <span class="led-text">LED 2</span>
            <input type="checkbox" class="estado_led" data-led="2" id="led2">
            <label for="led2" class="led-label"></label>
        </div>

        <!-- LED 3 -->
        <div class="led-switch" data-led="3">
            <span class="led-text">LED 3</span>
            <input type="checkbox" class="estado_led" data-led="3" id="led3">
            <label for="led3" class="led-label"></label>
        </div>

        <!-- TODOS -->
        <div class="led-switch" data-led="ALL">
            <span class="led-text">TODOS</span>
            <input type="checkbox" class="estado_led" data-led="ALL" id="ledAll">
            <label for="ledAll" class="led-label"></label>
        </div>
    </div>

    <script>
        document.querySelectorAll(".estado_led").forEach((checkbox) => {
            checkbox.addEventListener("change", function () {
                const estado = this.checked ? '1' : '0';
                const led_id = this.getAttribute("data-led");

                const formDataLed = new FormData();
                formDataLed.append("estado", estado);
                formDataLed.append("led_id", led_id);

                fetch("{{ url_for('estado_led') }}", {
                    method: "POST",
                    body: formDataLed
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Error al controlar LED: " + response.status);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log(`LED ${led_id} →`, data);
                })
                .catch(error => {
                    console.error("Error:", error);
                });

                const formDataGuardar = new FormData();
                formDataGuardar.append("estado", estado);
                formDataGuardar.append("led_id", led_id);

                fetch("/usuario/save_estado", {
                    method: "POST",
                    body: formDataGuardar
                })
                .then(response => response.json())
                .then(data => {
                    console.log("Estado guardado:", data);
                })
                .catch(error => {
                    console.error("Error al guardar estado:", error);
                });
            });
        });
    </script>
    
    <script src="{{ url_for('static', filename='js/effects.js') }}"></script>
</body>
</html>
