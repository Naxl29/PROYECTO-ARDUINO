<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Iniciar Sesión - Control LED</title>
    <meta name="description" content="Inicia sesión en el sistema de control LED">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
    
    <!-- Mobile helpers -->
    <script src="{{ url_for('static', filename='js/mobile-helpers.js') }}"></script>
</head>
<body>
    <div class="login-container">
        <h1 class="login-title">INICIA</h1>
        <p class="login-subtitle">PARA CONTINUAR</p>
        <form id="campos" method="post" action="{{ url_for('login') }}">
            <div class="input-group">
                <div class="input-container">
                    <i class="fas fa-user icon"></i>
                    <input type="text" id="usuario" name="usuario" autocomplete="username" placeholder="usuario">
                </div>
            </div>
            <div class="input-group">
                <div class="input-container">
                    <i class="fas fa-lock icon"></i>
                    <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" placeholder="contraseña">
                </div>
            </div>
            <button type="submit" class="login-btn">INICIAR</button>
        </form>
        <p class="auth-link">¿No tienes una cuenta? <a href="{{ url_for('create') }}">¡Regístrate!</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
    
    {% if error_message %}
    <script>
        showErrorMessage('{{ error_message }}');
    </script>
    {% endif %}
</body>
</html>
