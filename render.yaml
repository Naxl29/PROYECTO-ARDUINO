services:
  - type: web
    name: proyecto-arduino
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -k gthread -b 0.0.0.0:$PORT app:app
    autoDeploy: true
    # Configuración de salud y reinicio
    healthCheckPath: /
    # Variables de entorno
    envVars:
      # Flask Configuration
      - key: FLASK_DEBUG
        value: "False"
      - key: FLASK_SECRET_KEY
        generateValue: true
      
      # Database Configuration (Railway)
      - key: DB_HOST
        value: "metro.proxy.rlwy.net"
      - key: DB_PORT
        value: "26716"
      - key: DB_DATABASE
        value: "railway"
      - key: DB_USER
        value: "root"
      - key: DB_PASSWORD
        value: "UVNmQTYpkxztSKbassprbcQoIRXzSQOU"
      
      # Arduino Configuration (disabled in production)
      - key: ARDUINO_IP
        value: "192.168.101.77"
      - key: ARDUINO_PORT
        value: "/dev/null"
      - key: ARDUINO_BAUDRATE
        value: "9600"
      
      # ML Model Configuration
      - key: MODEL_PATH
        value: "Model/modelo_recibo.pkl"
      
      # Logging Configuration
      - key: LOG_LEVEL
        value: "INFO"
      - key: LOG_FILE
        value: "app.log"
